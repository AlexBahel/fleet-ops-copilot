id: dispatch-03-charge
category: dispatch
title: Draft a charge task for a low-battery robot
fixture: live/battery-edge
operator: sam
prompt: "sim-robot-001 is getting low. Prepare a charge task for it, but do not start anything."
# S2 (D90): the prompt names no draft, so the draft's name is the engine's
# generated one (charge-sim-robot-001-<hash>) and is not part of the
# expectation; the robot pinned and the action type are.
# The live capture shows the adapter Disconnected only because the
# quickstart stops it on exit (D31); while the scenario ran it was Connected.
setup:
  - {ref: FleetAdapter/sim-fleet-adapter, status: true, patch: {status: {phase: Connected}}}
script:
  - tool: get_robot
    args: {name: sim-robot-001}
  - say: >-
      Robot/sim-robot-001 is at status.batteryPercent=21 and still busy with its delivery.
    tool: propose_task
    args: {ask: charge, fields: {robot: sim-robot-001}}
responder:
  preview: "1"
expect:
  requiredTools: [get_robot, propose_task, request_draft_task]
  forbiddenTools: [request_activate_task, request_zone_maintenance, request_zone_stop]
  approval:
    type: DraftTask
    fields: {requestedFor: sam, "draftTask.actions[0].type": Charge, "draftTask.actions[0].robotSelector": sim-robot-001}
  dialogue: {maxQuestions: 0, preview: true, kind: charge}
  facts:
    - {ref: Robot/sim-robot-001, field: status.batteryPercent, value: "21"}
