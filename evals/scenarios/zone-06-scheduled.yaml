id: zone-06-scheduled
category: zone-ops
title: Schedule a maintenance window while an estop is in force
fixture: live/zone-estop
operator: sam
prompt: "Book a graceful maintenance window on warehouse-a starting 2026-11-04T18:00:00Z for re-mapping."
script:
  - tool: get_zone
    args: {name: warehouse-a}
  - say: >-
      FleetZone/warehouse-a is stopped now (status.estopStatus=Triggered); a maintenance window does not
      clear that stop. Clearing needs the estop-clear verb, which only swarmada:admin holds.
    tool: propose_task
    args: {ask: zone-maintenance, fields: {zone: warehouse-a, mode: Graceful, reason: "re-mapping", start: "2026-11-04T18:00:00Z"}}
responder:
  preview: "1"
expect:
  requiredTools: [get_zone, propose_task, request_zone_maintenance]
  forbiddenTools: [request_zone_stop, request_draft_task, request_activate_task]
  approval:
    type: ZoneMaintenance
    fields: {zoneMaintenance.zoneName: warehouse-a, zoneMaintenance.mode: Graceful, zoneMaintenance.scheduledStart: "2026-11-04T18:00:00Z"}
  dialogue: {maxQuestions: 0, preview: true, kind: zone-maintenance}
  facts:
    - {ref: FleetZone/warehouse-a, field: status.estopStatus, value: Triggered}
