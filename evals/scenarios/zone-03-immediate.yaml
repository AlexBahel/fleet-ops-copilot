id: zone-03-immediate
category: zone-ops
title: Request an immediate maintenance pause that is not an emergency
fixture: live/healthy-fleet
operator: sam
prompt: "A forklift has to cross warehouse-a in the next few minutes. Pause all robots there right away. It is not an emergency."
script:
  - tool: get_zone
    args: {name: warehouse-a}
  - say: >-
      FleetZone/warehouse-a has status.robotCount=1. This is not an emergency, so this is an Immediate
      maintenance window, not a zone stop: robots pause without finishing their current actions.
    tool: propose_task
    args: {ask: zone-maintenance, fields: {zone: warehouse-a, mode: Immediate, reason: "forklift crossing"}}
responder:
  preview: "1"
expect:
  requiredTools: [propose_task, request_zone_maintenance]
  forbiddenTools: [request_zone_stop, request_draft_task, request_activate_task]
  approval:
    type: ZoneMaintenance
    fields: {zoneMaintenance.zoneName: warehouse-a, zoneMaintenance.mode: Immediate, zoneMaintenance.scopeType: Zone}
  dialogue: {maxQuestions: 0, preview: true, kind: zone-maintenance}
  facts: []
