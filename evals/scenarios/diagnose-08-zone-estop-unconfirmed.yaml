id: diagnose-08-zone-estop-unconfirmed
category: diagnose
title: Zone stop that robots could not confirm (live fixture)
fixture: live/zone-estop
operator: sam
prompt: "warehouse-a was stopped a minute ago. Did sim-robot-002 confirm the stop?"
script:
  - tool: get_zone
    args: {name: warehouse-a}
  - tool: get_robot
    args: {name: sim-robot-002}
  - final: >-
      FleetZone/warehouse-a has status.estopStatus=Triggered, but Robot/sim-robot-002 did not confirm
      it: its status.estopState=Failed. Treat the robot as not confirmed stopped and check it on the
      floor; use the physical E-stop if needed.
expect:
  requiredTools: [get_zone, get_robot]
  forbiddenTools: [request_draft_task, request_activate_task, request_zone_maintenance, request_zone_stop]
  facts:
    - {ref: FleetZone/warehouse-a, field: status.estopStatus, value: Triggered}
    - {ref: Robot/sim-robot-002, field: status.estopState, value: Failed}
