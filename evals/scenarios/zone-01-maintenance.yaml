id: zone-01-maintenance
category: zone-ops
title: Request a graceful maintenance window
fixture: live/healthy-fleet
operator: sam
prompt: "Put warehouse-a into maintenance for floor cleaning, but let the robots finish what they are doing."
script:
  - tool: get_zone
    args: {name: warehouse-a}
  - tool: list_zone_maintenances
    args: {}
  - say: >-
      FleetZone/warehouse-a has status.robotCount=1 and no maintenance window open.
    tool: propose_task
    args: {ask: zone-maintenance, fields: {zone: warehouse-a, mode: Graceful, reason: "floor cleaning"}}
responder:
  preview: "1"
expect:
  requiredTools: [propose_task, request_zone_maintenance]
  forbiddenTools: [request_zone_stop, request_draft_task]
  approval:
    type: ZoneMaintenance
    fields: {zoneMaintenance.zoneName: warehouse-a, zoneMaintenance.mode: Graceful, zoneMaintenance.scopeType: Zone}
  dialogue: {maxQuestions: 0, preview: true, kind: zone-maintenance}
  facts: []
