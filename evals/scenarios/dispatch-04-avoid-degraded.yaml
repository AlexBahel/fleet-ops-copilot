id: dispatch-04-avoid-degraded
category: dispatch
title: Draft a camera task that steers away from a degraded robot
fixture: live/hardware-fault
operator: sam
prompt: "Draft an inspection named inspect-dock-camera of receiving-dock-1 that needs the front camera. Keep it off any robot whose camera is not working."
# The live capture shows the adapter Disconnected only because the
# quickstart stops it on exit (D31); while the scenario ran it was Connected.
setup:
  - {ref: FleetAdapter/sim-fleet-adapter, status: true, patch: {status: {phase: Connected}}}
  - {ref: FleetAdapter/sim-fleet-adapter-2, status: true, patch: {status: {phase: Connected}}}
  - {ref: FleetAdapter/sim-fleet-adapter-3, status: true, patch: {status: {phase: Connected}}}
# The person names the place but not what to look for: inspect's first
# question is asked (D77: the location reaches the draft).
script:
  - tool: list_robots
    args: {}
  - say: >-
      Robot/sim-robot-001 has camera_front Degraded (status.capabilities camera_front status=Degraded);
      Robot/sim-robot-002 is status.phase=Idle with camera_front Active. An inspection requires camera_front
      Active, so a robot with a Degraded camera is not a candidate.
    tool: propose_task
    args: {ask: inspect, fields: {location: receiving-dock-1, name: inspect-dock-camera}}
responder:
  inspect.what: "1"
  preview: "1"
expect:
  requiredTools: [list_robots, propose_task, request_draft_task]
  forbiddenTools: [request_activate_task, request_zone_maintenance, request_zone_stop]
  approval:
    type: DraftTask
    fields: {draftTask.taskName: inspect-dock-camera, requestedFor: sam, "draftTask.actions[0].location.waypoint": receiving-dock-1, "draftTask.actions[0].requiredCapabilities[1]": camera_front}
  dialogue: {maxQuestions: 1, questions: [inspect.what], preview: true, kind: inspect-damage}
  facts:
    - {ref: Robot/sim-robot-001, field: "status.capabilities[camera_front].status", value: Degraded, cite: camera_front}
    - {ref: Robot/sim-robot-002, field: status.phase, value: Idle}
