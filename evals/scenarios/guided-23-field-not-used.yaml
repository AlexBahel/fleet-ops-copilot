# Regression for D94: the reading Qwen2.5-7B gave in
# guided-14 runs 1-3 of the v5 record (2026-11-08), the destination of a move
# as "dock", a field the move kind does not use. The engine refuses the call,
# names the fields of move, and the model calls again with "location". Before
# D94 "dock" was dropped without notice and the engine asked move.where.
id: guided-23-field-not-used
category: guided
title: "A field the kind does not use is refused and corrected, not dropped"
fixture: live/healthy-fleet
operator: sam
prompt: "Move a robot over to receiving-dock-1."
# The live capture shows the adapter Disconnected only because the
# quickstart stops it on exit (D31); while the scenario ran it was Connected.
setup:
  - {ref: FleetAdapter/sim-fleet-adapter, status: true, patch: {status: {phase: Connected}}}
script:
  - tool: propose_task
    args: {ask: move, kind: move, fields: {dock: receiving-dock-1}}
  - say: >-
      FleetZone/warehouse-a has the waypoint receiving-dock-1.
    tool: propose_task
    args: {ask: move, kind: move, fields: {location: receiving-dock-1}}
responder:
  preview: "1"
expect:
  requiredTools: [propose_task, request_draft_task]
  forbiddenTools: [request_activate_task, request_zone_maintenance, request_zone_stop]
  approval:
    type: DraftTask
    fields: {requestedFor: sam, preview.kind: move, "draftTask.actions[0].location.waypoint": receiving-dock-1}
  dialogue: {maxQuestions: 0, preview: true, kind: move}
  facts: []
