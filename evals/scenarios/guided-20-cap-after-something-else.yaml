# Regression for BACKLOG-v4 P6 (D87): the path Sonnet 5.5 took in guided-06
# runs 1-3. After inspect.what, "4" and the open question, the model reads
# the description as a charge (a new ask, not somethingElse). That is its
# reading: the charge is previewed with no third question. Before D87 the
# engine asked inspect.what again, a third question.
id: guided-20-cap-after-something-else
category: guided
title: "A new ask after a \"something else\" description is its reading; no third question"
fixture: live/healthy-fleet
operator: sam
prompt: "I need an inspection."
# The live capture shows the adapter Disconnected only because the
# quickstart stops it on exit (D31); while the scenario ran it was Connected.
setup:
  - {ref: FleetAdapter/sim-fleet-adapter, status: true, patch: {status: {phase: Connected}}}
script:
  - tool: propose_task
    args: {ask: inspect}
  - tool: propose_task
    args: {ask: charge, fields: {robot: sim-robot-003, dock: charging-bay, location: charging-bay}}
  # Since D94 the location, which charge does not use, is refused to the
  # model, which calls again without it; the person sees no extra question.
  - tool: propose_task
    args: {ask: charge, fields: {robot: sim-robot-003, dock: charging-bay}}
responder:
  inspect.what: "4"
  somethingElse.describe: "send sim-robot-003 to the charging bay and have it charge there"
  preview: "1"
expect:
  requiredTools: [propose_task, request_draft_task]
  forbiddenTools: [request_activate_task, request_zone_maintenance, request_zone_stop]
  approval:
    type: DraftTask
    fields: {requestedFor: sam, preview.kind: charge, "draftTask.actions[0].type": Charge, "draftTask.actions[0].robotSelector": sim-robot-003}
  dialogue: {maxQuestions: 2, questions: [inspect.what, somethingElse.describe], preview: true, kind: charge}
  facts: []
