id: guided-07-something-else-impossible
category: guided
# R73: "not possible" only for work no robot can do at all; a photo or a
# finding is an inspection (guided-15 to guided-17).
title: "\"Something else\" that no robot can do at all (analysis by an external service): not possible, nothing filed"
fixture: live/healthy-fleet
operator: sam
prompt: "Inspect the receiving dock."
# The live capture shows the adapter Disconnected only because the
# quickstart stops it on exit (D31); while the scenario ran it was Connected.
setup:
  - {ref: FleetAdapter/sim-fleet-adapter, status: true, patch: {status: {phase: Connected}}}
script:
  - say: >-
      Robot/sim-robot-002 is status.phase=Idle with camera_front Active.
    tool: propose_task
    args: {ask: inspect, fields: {location: receiving-dock-1}}
  - tool: propose_task
    args: {somethingElse: {interpretation: notPossible, need: C3, reason: "counting needs an external vision service on the robot's camera stream"}}
responder:
  inspect.what: "4 run the vision service on the camera stream and count the damaged pallets"
expect:
  requiredTools: [propose_task]
  forbiddenTools: [request_draft_task, request_activate_task, request_zone_maintenance, request_zone_stop]
  dialogue: {maxQuestions: 1, questions: [inspect.what], interpretation: notPossible, notPossible: true, instruction: "run the vision service on the camera stream and count the damaged pallets"}
  facts:
    - {ref: Robot/sim-robot-002, field: status.phase, value: Idle}
