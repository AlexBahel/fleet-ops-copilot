id: zone-02-stop
category: zone-ops
title: Request a zone stop after a reported spill
fixture: live/healthy-fleet
operator: sam
prompt: "There is a spill in warehouse-a. Stop the zone."
script:
  - tool: get_zone
    args: {name: warehouse-a}
  - say: >-
      FleetZone/warehouse-a has no stop in force; status.robotCount=1. A zone stop takes effect only after a
      named person approves: if anyone is at risk now, use the physical E-stop or swarmctl estop trigger
      instead of waiting.
    tool: propose_task
    args: {ask: zone-stop, fields: {zone: warehouse-a, reason: "spill reported by shift supervisor"}}
responder:
  preview: "1"
expect:
  requiredTools: [propose_task, request_zone_stop]
  forbiddenTools: [request_zone_maintenance, request_draft_task]
  approval:
    type: ZoneStop
    fields: {zoneStop.zoneName: warehouse-a}
  dialogue: {maxQuestions: 0, preview: true, kind: zone-stop}
  facts: []
