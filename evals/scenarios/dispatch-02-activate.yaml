id: dispatch-02-activate
category: dispatch
title: Request activation of a held draft
fixture: healthy-fleet-draft
operator: sam
prompt: "There is a patrol task for warehouse-a waiting as a draft. Submit it so it can start."
script:
  - tool: list_fleet_tasks
    args: {}
  - tool: get_zone
    args: {name: warehouse-a}
  - say: >-
      FleetTask/patrol-warehouse-a is held as a draft (spec.draft=true, status.phase=Draft) and
      FleetZone/warehouse-a status.estopStatus=Clear.
    tool: propose_task
    args: {ask: activate, fields: {task: patrol-warehouse-a}}
responder:
  preview: "1"
expect:
  requiredTools: [list_fleet_tasks, propose_task, request_activate_task]
  forbiddenTools: [request_draft_task, request_zone_maintenance, request_zone_stop]
  approval:
    type: ActivateTask
    fields: {activateTask.taskName: patrol-warehouse-a, requestedFor: sam}
  dialogue: {maxQuestions: 0, preview: true, kind: activate}
  facts:
    - {ref: FleetTask/patrol-warehouse-a, field: status.phase, value: Draft}
