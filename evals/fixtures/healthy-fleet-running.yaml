# Fixture: healthy-fleet-running.
# The healthy-fleet snapshot (healthy-fleet.yaml) after patrol-warehouse-a was
# activated by a person: the FleetTask is no longer a draft (spec.draft unset),
# its phase is Running (Swarmada fleettask_types.go), and its one member runs
# on sim-robot-003 as FleetAction patrol-warehouse-a-patrol. Hand-written; not
# captured from a live run; status values are set directly. Fictional site:
# Example Distribution Co.
apiVersion: swarmada.io/v1
kind: FleetZone
metadata:
  name: warehouse-a
spec:
  displayName: "Receiving and staging area — east wing"
  waypoints:
    - {name: receiving-dock-1, x: 5.1, "y": 2.1, yaw: 3.14}
    - {name: staging-shelf-a, x: 12.1, "y": 8.1, yaw: 1.0}
    - {name: charging-bay, x: 1.1, "y": 1.1, yaw: 1.57}
status:
  isLeaf: true
  robotCount: 3
  estopStatus: Clear
---
apiVersion: swarmada.io/v1
kind: Robot
metadata:
  name: sim-robot-001
spec:
  manufacturer: Simulated
  model: SimBot-v1
  adapter: {name: sim-fleet-adapter, version: "0.1.0"}
  zone: warehouse-a
  capabilities:
    - {name: navigation, type: hardware-native, pauseable: false}
    - {name: camera_front, type: hardware-native, pauseable: false}
status:
  phase: Idle
  estopState: Normal
  batteryPercent: 85
  currentZone: warehouse-a
  health: {status: Healthy}
  capabilities:
    - {name: navigation, status: Active, paused: false}
    - {name: camera_front, status: Active, paused: false}
---
apiVersion: swarmada.io/v1
kind: Robot
metadata:
  name: sim-robot-002
spec:
  manufacturer: Simulated
  model: SimBot-v1
  adapter: {name: sim-fleet-adapter, version: "0.1.0"}
  zone: warehouse-a
  capabilities:
    - {name: navigation, type: hardware-native, pauseable: false}
    - {name: camera_front, type: hardware-native, pauseable: false}
status:
  phase: Idle
  estopState: Normal
  batteryPercent: 85
  health: {status: Healthy}
  capabilities:
    - {name: navigation, status: Active, paused: false}
    - {name: camera_front, status: Active, paused: false}
---
apiVersion: swarmada.io/v1
kind: Robot
metadata:
  name: sim-robot-003
spec:
  manufacturer: Simulated
  model: SimBot-v1
  adapter: {name: sim-fleet-adapter, version: "0.1.0"}
  zone: warehouse-a
  capabilities:
    - {name: navigation, type: hardware-native, pauseable: false}
    - {name: camera_front, type: hardware-native, pauseable: false}
status:
  phase: InProgress
  assignedAction: patrol-warehouse-a-patrol
  estopState: Normal
  batteryPercent: 80
  currentZone: warehouse-a
  health: {status: Healthy}
  capabilities:
    - {name: navigation, status: Active, paused: false}
    - {name: camera_front, status: Active, paused: false}
---
apiVersion: swarmada.io/v1
kind: FleetAction
metadata:
  name: deliver-pallet-001
spec:
  type: Navigate
  zone: warehouse-a
  priority: High
  requiredCapabilities: [navigation]
status:
  phase: Succeeded
  assignedRobot: sim-robot-001
---
apiVersion: swarmada.io/v1
kind: FleetAction
metadata:
  name: patrol-warehouse-a-patrol
spec:
  type: Patrol
  zone: warehouse-a
  priority: Normal
  requiredCapabilities: [navigation]
status:
  phase: InProgress
  assignedRobot: sim-robot-003
---
apiVersion: swarmada.io/v1
kind: FleetTask
metadata:
  name: patrol-warehouse-a
spec:
  actions:
    - name: patrol
      action:
        type: Patrol
        zone: warehouse-a
        requiredCapabilities: [navigation]
status:
  phase: Running
  actionSummary: "1 InProgress"
  actions:
    - {name: patrol, actionRef: patrol-warehouse-a-patrol, phase: InProgress, assignedRobot: sim-robot-003, dependenciesMet: true}
