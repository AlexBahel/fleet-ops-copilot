# Fixture: battery-edge.
# Hand-written snapshot modelled on the Swarmada quickstart scenario
# `battery-edge` (docs/quickstart.md and adapters/scenarios/presets/
# battery-edge.yaml in the Swarmada module): sim-robot-001 keeps its task
# while its battery falls through the teens. Nothing pulls an already-assigned
# action off a robot because its battery drops; FleetAction spec.minBatteryPct
# filters new assignments only (scheduler candidate filter 4). The second
# action sets minBatteryPct and stays Pending. Its status.message is written
# for this fixture, not copied from Swarmada output. Not captured from a live
# run; status values are set directly. Fictional site: Example Distribution Co.
apiVersion: swarmada.io/v1
kind: FleetZone
metadata:
  name: warehouse-a
spec:
  displayName: "Receiving and staging area — east wing"
  waypoints:
    - {name: receiving-dock-1, x: 5.1, "y": 2.1, yaw: 3.14}
    - {name: staging-shelf-a, x: 12.1, "y": 8.1, yaw: 1.0}
    - {name: charging-bay, x: 1.1, "y": 1.1, yaw: 1.57}
status:
  isLeaf: true
  robotCount: 3
  estopStatus: Clear
---
apiVersion: swarmada.io/v1
kind: Robot
metadata:
  name: sim-robot-001
spec:
  manufacturer: Simulated
  model: SimBot-v1
  adapter: {name: sim-fleet-adapter, version: "0.1.0"}
  zone: warehouse-a
  capabilities:
    - {name: navigation, type: hardware-native, pauseable: false}
    - {name: camera_front, type: hardware-native, pauseable: false}
status:
  phase: InProgress
  assignedAction: deliver-pallet-001
  estopState: Normal
  batteryPercent: 14
  currentZone: warehouse-a
  health: {status: Healthy}
  capabilities:
    - {name: navigation, status: Active, paused: false}
    - {name: camera_front, status: Active, paused: false}
---
apiVersion: swarmada.io/v1
kind: Robot
metadata:
  name: sim-robot-002
spec:
  manufacturer: Simulated
  model: SimBot-v1
  adapter: {name: sim-fleet-adapter, version: "0.1.0"}
  zone: warehouse-a
  capabilities:
    - {name: navigation, type: hardware-native, pauseable: false}
    - {name: camera_front, type: hardware-native, pauseable: false}
status:
  phase: Idle
  estopState: Normal
  batteryPercent: 85
  health: {status: Healthy}
  capabilities:
    - {name: navigation, status: Active, paused: false}
    - {name: camera_front, status: Active, paused: false}
---
apiVersion: swarmada.io/v1
kind: Robot
metadata:
  name: sim-robot-003
spec:
  manufacturer: Simulated
  model: SimBot-v1
  adapter: {name: sim-fleet-adapter, version: "0.1.0"}
  zone: warehouse-a
  capabilities:
    - {name: navigation, type: hardware-native, pauseable: false}
    - {name: camera_front, type: hardware-native, pauseable: false}
status:
  phase: Idle
  estopState: Normal
  batteryPercent: 85
  health: {status: Healthy}
  capabilities:
    - {name: navigation, status: Active, paused: false}
    - {name: camera_front, status: Active, paused: false}
---
apiVersion: swarmada.io/v1
kind: FleetAction
metadata:
  name: deliver-pallet-001
spec:
  type: Navigate
  zone: warehouse-a
  priority: High
  requiredCapabilities: [navigation]
status:
  phase: InProgress
  assignedRobot: sim-robot-001
  progressPct: 60
---
apiVersion: swarmada.io/v1
kind: FleetAction
metadata:
  name: restock-shelf-a
spec:
  type: Navigate
  zone: warehouse-a
  priority: Normal
  requiredCapabilities: [navigation]
  minBatteryPct: 20
status:
  phase: Pending
  message: "no candidate robot: sim-robot-001 is InProgress and its status.batteryPercent 14 is below spec.minBatteryPct 20; the other robots report no position, so none is placed in the zone"
---
# FleetAdapter added 2026-11-04 (docs/DESIGN.md D47): the robots above name
# sim-fleet-adapter in spec.adapter. Spec copied from live/battery-edge.yaml;
# status written for this fixture: phase Connected, because this snapshot is
# taken while the scenario runs (the live captures show Disconnected only
# because the quickstart stops its adapter on exit, D31); conformance Passed
# as captured.
apiVersion: swarmada.io/v1
kind: FleetAdapter
metadata:
  name: sim-fleet-adapter
spec:
