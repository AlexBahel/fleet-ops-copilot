# Fixture: healthy-fleet-draft.
# A hand-written healthy fleet (one zone, three robots, two actions) plus one
# FleetTask held as a draft (spec.draft: true, status.phase: Draft; Swarmada fleettask_types.go),
# as a person or a TaskTrigger (RFC-0003) would leave it before activation.
# Hand-written; not captured from a live run. Fictional site: Example
# Distribution Co.
apiVersion: swarmada.io/v1
kind: FleetZone
metadata:
  name: warehouse-a
spec:
  displayName: "Receiving and staging area — east wing"
  waypoints:
    - {name: receiving-dock-1, x: 5.1, "y": 2.1, yaw: 3.14}
    - {name: staging-shelf-a, x: 12.1, "y": 8.1, yaw: 1.0}
    - {name: charging-bay, x: 1.1, "y": 1.1, yaw: 1.57}
status:
  isLeaf: true
  robotCount: 3
  estopStatus: Clear
---
# robotClass and currentZone added 2026-11-06 (D81): the robots' class is
# the one their adapter serves (servesRobotClasses: simbot-v1) and every
# robot reports the zone it stands in, as the live captures show. Without
# them Swarmada's candidate filters 9 and 2 would give these robots no work,
# which check_task now reports.
apiVersion: swarmada.io/v1
kind: Robot
metadata:
  name: sim-robot-001
spec:
  manufacturer: Simulated
  model: SimBot-v1
  adapter: {name: sim-fleet-adapter, version: "0.1.0"}
  robotClass: simbot-v1
  zone: warehouse-a
  capabilities:
    - {name: navigation, type: hardware-native, pauseable: false}
    - {name: camera_front, type: hardware-native, pauseable: false}
status:
  phase: Idle
  estopState: Normal
  batteryPercent: 85
  currentZone: warehouse-a
  health: {status: Healthy}
  capabilities:
    - {name: navigation, status: Active, paused: false}
    - {name: camera_front, status: Active, paused: false}
---
apiVersion: swarmada.io/v1
kind: Robot
metadata:
  name: sim-robot-002
spec:
  manufacturer: Simulated
  model: SimBot-v1
  adapter: {name: sim-fleet-adapter, version: "0.1.0"}
  robotClass: simbot-v1
  zone: warehouse-a
  capabilities:
    - {name: navigation, type: hardware-native, pauseable: false}
    - {name: camera_front, type: hardware-native, pauseable: false}
status:
  phase: Idle
  estopState: Normal
  batteryPercent: 85
  currentZone: warehouse-a
  health: {status: Healthy}
  capabilities:
    - {name: navigation, status: Active, paused: false}
    - {name: camera_front, status: Active, paused: false}
---
apiVersion: swarmada.io/v1
kind: Robot
metadata:
  name: sim-robot-003
spec:
  manufacturer: Simulated
  model: SimBot-v1
  adapter: {name: sim-fleet-adapter, version: "0.1.0"}
  robotClass: simbot-v1
  zone: warehouse-a
  capabilities:
    - {name: navigation, type: hardware-native, pauseable: false}
    - {name: camera_front, type: hardware-native, pauseable: false}
status:
  phase: Idle
  estopState: Normal
  batteryPercent: 85
  currentZone: warehouse-a
  health: {status: Healthy}
  capabilities:
    - {name: navigation, status: Active, paused: false}
    - {name: camera_front, status: Active, paused: false}
---
apiVersion: swarmada.io/v1
kind: FleetAction
metadata:
  name: deliver-pallet-001
spec:
  type: Navigate
  zone: warehouse-a
  priority: High
  requiredCapabilities: [navigation]
status:
  phase: Succeeded
  assignedRobot: sim-robot-001
---
apiVersion: swarmada.io/v1
kind: FleetAction
metadata:
  name: inspect-receiving-dock
spec:
  type: Navigate
  zone: warehouse-a
  priority: Normal
  requiredCapabilities: [navigation, camera_front]
status:
  phase: Pending
  message: "no candidate robot: the robots without an adapter report no position, so none is placed in the zone"
---
apiVersion: swarmada.io/v1
kind: FleetTask
metadata:
  name: patrol-warehouse-a
spec:
  draft: true
  actions:
    - name: patrol
      action:
        type: Patrol
        zone: warehouse-a
        requiredCapabilities: [navigation]
status:
  phase: Draft
---
# FleetAdapter added 2026-11-04 (docs/DESIGN.md D47): the robots above name
# sim-fleet-adapter in spec.adapter. Spec copied from live/battery-edge.yaml;
# status written for this fixture: phase Connected, because this snapshot is
# taken while the scenario runs (the live captures show Disconnected only
# because the quickstart stops its adapter on exit, D31); conformance Passed
# as captured.
apiVersion: swarmada.io/v1
kind: FleetAdapter
metadata:
  name: sim-fleet-adapter
spec:
  conformanceReport:
    configMapRef: sim-adapter-conformance
    digest: sha256:9ba950153e6e1a67f490e78aaf43bd4cef2e0f04d7b6237ab15eca98a00fb6f4
    suiteVersion: C1-C15
  endpoint: 127.0.0.1:19443
  heartbeatIntervalSeconds: 600
  protocolVersion: fleet_adapter.v1
  servesRobotClasses:
  - simbot-v1
  simulated: false
  vendor: simulation
status:
  phase: Connected
  conformance: Passed
