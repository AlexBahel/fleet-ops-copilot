{{- include "fleetops.validate" . }}
# The copilot policy file, read by fleetops-mcp and fleetops-approvals. Site rules only;
# the hard invariants are compiled in (docs/DESIGN.md §3.2).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fleetops-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleetops.chartLabels" . | nindent 4 }}
data:
  default.yaml: |
    {{- include "fleetops.policy" . | nindent 4 }}
