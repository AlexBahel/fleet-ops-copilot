{{- include "foc.validate" . }}
{{- if .Values.agent.enabled }}
# The site catalogue, read by foc-agent (docs/DESIGN.md §3.10.1, D70).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fleetops-catalogue
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "foc.chartLabels" . | nindent 4 }}
data:
  site.yaml: |
    {{- include "foc.catalogue" . | nindent 4 }}
{{- end }}
