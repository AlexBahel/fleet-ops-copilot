{{- include "fleetops.validate" . }}
{{- if .Values.networkPolicy.enabled }}
# Cloud-profile NetworkPolicy (docs/DESIGN.md §3.7): default-deny ingress and
# egress in the release namespace, then DNS for every pod, the API server for
# fleetops-mcp, fleetops-approvals and fleetops-agent (which reads ApprovalRequests),
# fleetops-agent -> fleetops-mcp, fleetops-agent -> the Claude API when CIDRs are given, and
# egress to the OTLP collector from otlpEgress.to. No ingress to fleetops-agent's
# web UI is allowed (R38: no Ingress; kubectl port-forward is normally not
# subject to NetworkPolicy, depending on the CNI). Policies are additive: a pod may do what
# any policy selecting it allows.
#
# Not applied to a cluster yet. Enforcement needs a CNI that implements
# NetworkPolicy; the egress probe (make verify-egress) checks the air-gapped
# policy in config/airgap, not this one. Kubelet probes and `kubectl port-forward` are normally
# not subject to NetworkPolicy, but that depends on the CNI.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fleet-ops-copilot-default-deny
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleetops.chartLabels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fleet-ops-copilot-egress-dns
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleetops.chartLabels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Values.networkPolicy.dns.namespace }}}}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dns.podLabels | nindent 14 }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
# NetworkPolicy cannot select the API server by label. Depending on the CNI
# the address seen is the Service address or, after DNAT, the endpoint, so
# both belong in apiServer.cidrs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fleet-ops-copilot-egress-apiserver
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleetops.chartLabels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [fleetops-mcp, fleetops-approvals, fleetops-agent]}
  policyTypes: [Egress]
  egress:
    - to:
        {{- range .Values.networkPolicy.apiServer.cidrs }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
      ports:
        {{- range .Values.networkPolicy.apiServer.ports }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
---
# fleetops-mcp accepts MCP connections from fleetops-agent (and any extra peers given).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fleetops-mcp-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleetops.chartLabels" . | nindent 4 }}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: fleetops-mcp}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: fleetops-agent}}
        {{- with .Values.networkPolicy.mcpExtraIngressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ .Values.mcp.port }}}
---
# fleetops-agent may open connections to fleetops-mcp.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fleetops-agent-egress-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleetops.chartLabels" . | nindent 4 }}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: fleetops-agent}}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: fleetops-mcp}}
      ports:
        - {protocol: TCP, port: {{ .Values.mcp.port }}}
{{- with .Values.networkPolicy.claudeApiEgress.cidrs }}
---
# fleetops-agent -> Claude API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fleetops-agent-egress-claude-api
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "fleetops.chartLabels" $ | nindent 4 }}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: fleetops-agent}}
  policyTypes: [Egress]
  egress:
    - to:
        {{- range . }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
      ports:
        {{- range $.Values.networkPolicy.claudeApiEgress.ports }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
{{- end }}
{{- if .Values.tracing.backend.enabled }}
---
# In-cluster trace backend (tracing.backend.enabled): fleetops-agent and fleetops-mcp ->
# the Collector, the Collector -> Jaeger. Each hop needs the egress rule on the
# sender and the ingress rule on the receiver, because the default-deny policy
# selects every pod in the namespace. The Collector's egress policy is rendered
# whenever the backend is on, also without networkPolicy.enabled (end of this
# file). The Jaeger UI is reached with kubectl port-forward, which is normally
# not subject to NetworkPolicy.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fleetops-otel-collector-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleetops.chartLabels" . | nindent 4 }}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: fleetops-otel-collector}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [fleetops-mcp, fleetops-agent]}
      ports:
        - {protocol: TCP, port: 4317}
---
# fleetops-mcp/fleetops-agent -> Collector. Only with networkPolicy.enabled: rendered
# alone, this Egress policy would deny those pods every other destination
# (API server, DNS). Beside config/airgap the same rule comes from
# config/airgap/networkpolicy-tracing.yaml (D69).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fleetops-otlp-egress-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleetops.chartLabels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [fleetops-mcp, fleetops-agent]}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: fleetops-otel-collector}}
      ports:
        - {protocol: TCP, port: 4317}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fleetops-jaeger-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleetops.chartLabels" . | nindent 4 }}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: fleetops-jaeger}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: fleetops-otel-collector}}
      ports:
        - {protocol: TCP, port: 4317}
{{- end }}
{{- with .Values.networkPolicy.otlpEgress.to }}
---
# fleetops-agent and fleetops-mcp -> OTLP collector.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fleet-ops-copilot-egress-otlp
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "fleetops.chartLabels" $ | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [fleetops-mcp, fleetops-agent]}
  policyTypes: [Egress]
  egress:
    - to:
        {{- toYaml . | nindent 8 }}
      ports:
        {{- range $.Values.networkPolicy.otlpEgress.ports }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
{{- end }}
{{- end }}
{{- if .Values.tracing.backend.enabled }}
---
# The Collector's egress, rendered whenever tracing.backend.enabled, with or
# without networkPolicy.enabled: Jaeger's OTLP port in this namespace and
# cluster DNS (to resolve fleetops-jaeger), nothing else. Without it, a namespace
# whose egress is otherwise denied (the air-gapped policy in config/airgap
# allows every pod but llama-server DNS only) cuts the Collector off from
# Jaeger once its connection is renewed: measured on kindnet, the policy
# applies to new connections only (docs/KNOWN-LIMITS.md).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fleetops-otel-collector-egress-jaeger
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleetops.chartLabels" . | nindent 4 }}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: fleetops-otel-collector}}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: fleetops-jaeger}}
      ports:
        - {protocol: TCP, port: 4317}
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Values.networkPolicy.dns.namespace }}}}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dns.podLabels | nindent 14 }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
{{- end }}
