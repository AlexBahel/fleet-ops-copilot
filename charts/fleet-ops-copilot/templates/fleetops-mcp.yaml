{{- include "fleetops.validate" . }}
# fleetops-mcp: tool server. Reads Swarmada, creates ApprovalRequests, never writes
# to Swarmada. The audit file is on an emptyDir volume and does not survive a
# pod restart (docs/KNOWN-LIMITS.md, "Audit storage").
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleetops-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleetops.workloadLabels" (dict "name" "fleetops-mcp" "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.mcp.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: fleetops-mcp}
  template:
    metadata:
      labels:
        {{- include "fleetops.workloadLabels" (dict "name" "fleetops-mcp" "root" .) | nindent 8 }}
      annotations:
        # Restart on a policy change (helm upgrade).
        checksum/policy: {{ include "fleetops.policy" . | sha256sum }}
    spec:
      serviceAccountName: fleetops-mcp
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: fleetops-mcp
          image: {{ include "fleetops.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/usr/local/bin/fleetops-mcp]
          args:
            - -policy=/etc/fleetops/policy/default.yaml
            - -audit={{ .Values.audit.dir }}/fleetops-mcp.jsonl
            - -namespace={{ first .Values.swarmadaNamespaces }}
            - -listen=:{{ .Values.mcp.port }}
            {{- with include "fleetops.otlpEndpoint" . }}
            - -otlp-endpoint={{ . }}
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: SERVICE_ACCOUNT
              valueFrom: {fieldRef: {fieldPath: spec.serviceAccountName}}
          ports: [{name: mcp, containerPort: {{ .Values.mcp.port }}}]
          readinessProbe: {httpGet: {path: /healthz, port: mcp}, periodSeconds: 5}
          {{- with .Values.mcp.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: policy, mountPath: /etc/fleetops/policy, readOnly: true}
            - {name: audit, mountPath: {{ .Values.audit.dir }}}
      volumes:
        - name: policy
          configMap: {name: fleetops-policy}
        - name: audit
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: fleetops-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleetops.workloadLabels" (dict "name" "fleetops-mcp" "root" .) | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: fleetops-mcp}
  ports: [{name: mcp, port: {{ .Values.mcp.port }}, targetPort: mcp}]
