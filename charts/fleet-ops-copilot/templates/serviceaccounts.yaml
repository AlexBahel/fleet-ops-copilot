{{- include "fleetops.validate" . }}
# The copilot's three ServiceAccounts (docs/DESIGN.md §3, §3.6). The namespace
# itself is created by `helm install --create-namespace`.
{{- if .Values.agent.serviceAccount.create }}
---
# Talks to the model and serves the web UI. May only get and list
# ApprovalRequests; no Swarmada access and no write.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleetops-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleetops.chartLabels" . | nindent 4 }}
{{- end }}
---
# MCP server: reads Swarmada and creates ApprovalRequests. No Swarmada write.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleetops-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleetops.chartLabels" . | nindent 4 }}
---
# Approval controller: executes approved drafts, zone maintenance and zone stops.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleetops-approvals
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleetops.chartLabels" . | nindent 4 }}
