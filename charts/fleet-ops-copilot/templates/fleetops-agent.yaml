{{- include "fleetops.validate" . }}
{{- if .Values.agent.enabled }}
# fleetops-agent: talks to the model (cloud profile: the Claude API, key from an
# existing Secret; airgap profile: llama-server in the cluster, no key), reaches fleetops-mcp over MCP, and serves the web chat and the
# approval-requests panel on its Service. Its ServiceAccount may only get and
# list ApprovalRequests: the page shows the `fleetops approve` / `fleetops reject`
# command a person runs with their own kubeconfig; it cannot decide.
# There is no login, so the typed operator name is recorded as an unverified
# requester and requests filed from the page can never be approved (D56). The
# Service stays ClusterIP and the chart renders no Ingress; reach it with
# `kubectl port-forward` (docs/RUNBOOK.md).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleetops-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleetops.workloadLabels" (dict "name" "fleetops-agent" "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.agent.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: fleetops-agent}
  template:
    metadata:
      labels:
        {{- include "fleetops.workloadLabels" (dict "name" "fleetops-agent" "root" .) | nindent 8 }}
      annotations:
        # Restart on a policy change (helm upgrade): propose_task offers only
        # the values the policy allows (docs/DESIGN.md D93).
        checksum/policy: {{ include "fleetops.policy" . | sha256sum }}
    spec:
      serviceAccountName: fleetops-agent
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: fleetops-agent
          image: {{ include "fleetops.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/usr/local/bin/fleetops-agent]
          args:
            {{- include "fleetops.agentBackendArgs" . | nindent 12 }}
            - -listen=:{{ .Values.agent.port }}
            - -mcp-url=http://fleetops-mcp:{{ .Values.mcp.port }}/mcp
            - -namespaces={{ join "," .Values.swarmadaNamespaces }}
            - -max-concurrent={{ .Values.agent.maxConcurrent }}
            - -catalogue=/etc/fleetops/catalogue/site.yaml
            - -policy=/etc/fleetops/policy/default.yaml
            - -audit={{ .Values.audit.dir }}/fleetops-agent.jsonl
            {{- with include "fleetops.otlpEndpoint" . }}
            - -otlp-endpoint={{ . }}
            {{- end }}
          env:
            {{- include "fleetops.agentBackendEnv" . | nindent 12 }}
          ports: [{name: http, containerPort: {{ .Values.agent.port }}}]
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 10, timeoutSeconds: 5}
          {{- with .Values.agent.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: catalogue, mountPath: /etc/fleetops/catalogue, readOnly: true}
            - {name: policy, mountPath: /etc/fleetops/policy, readOnly: true}
            - {name: audit, mountPath: {{ .Values.audit.dir }}}
      volumes:
        - name: catalogue
          configMap: {name: fleetops-catalogue}
        - name: policy
          configMap: {name: fleetops-policy}
        - name: audit
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: fleetops-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleetops.workloadLabels" (dict "name" "fleetops-agent" "root" .) | nindent 4 }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: fleetops-agent}
  ports: [{name: http, port: {{ .Values.agent.port }}, targetPort: http}]
{{- end }}
