{{- include "foc.validate" . }}
# Three RoleBindings in every Swarmada namespace in swarmadaNamespaces, and the
# two cluster-scoped bindings for the webhook-configuration reads and
# SubjectAccessReviews.
{{- range .Values.swarmadaNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleetops-foc-mcp
  namespace: {{ . }}
  labels:
    {{- include "foc.chartLabels" $ | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "fleetops:foc-mcp"}
subjects:
  - {kind: ServiceAccount, name: foc-mcp, namespace: {{ $.Release.Namespace }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleetops-foc-approvals
  namespace: {{ . }}
  labels:
    {{- include "foc.chartLabels" $ | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "fleetops:foc-approvals"}
subjects:
  - {kind: ServiceAccount, name: foc-approvals, namespace: {{ $.Release.Namespace }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleetops-foc-agent
  namespace: {{ . }}
  labels:
    {{- include "foc.chartLabels" $ | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "fleetops:foc-agent"}
subjects:
  - {kind: ServiceAccount, name: foc-agent, namespace: {{ $.Release.Namespace }}}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fleetops-foc-mcp-cluster
  labels:
    {{- include "foc.chartLabels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "fleetops:foc-mcp-cluster"}
subjects:
  - {kind: ServiceAccount, name: foc-mcp, namespace: {{ .Release.Namespace }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fleetops-foc-approvals-cluster
  labels:
    {{- include "foc.chartLabels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "fleetops:foc-approvals-cluster"}
subjects:
  - {kind: ServiceAccount, name: foc-approvals, namespace: {{ .Release.Namespace }}}
