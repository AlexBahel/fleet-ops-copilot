{{- include "fleetops.validate" . }}
# Three RoleBindings in every Swarmada namespace in swarmadaNamespaces, and the
# two cluster-scoped bindings for the webhook-configuration reads and
# SubjectAccessReviews.
{{- range .Values.swarmadaNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleetops-mcp
  namespace: {{ . }}
  labels:
    {{- include "fleetops.chartLabels" $ | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "fleetops:fleetops-mcp"}
subjects:
  - {kind: ServiceAccount, name: fleetops-mcp, namespace: {{ $.Release.Namespace }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleetops-approvals
  namespace: {{ . }}
  labels:
    {{- include "fleetops.chartLabels" $ | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "fleetops:fleetops-approvals"}
subjects:
  - {kind: ServiceAccount, name: fleetops-approvals, namespace: {{ $.Release.Namespace }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleetops-agent
  namespace: {{ . }}
  labels:
    {{- include "fleetops.chartLabels" $ | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "fleetops:fleetops-agent"}
subjects:
  - {kind: ServiceAccount, name: fleetops-agent, namespace: {{ $.Release.Namespace }}}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fleetops-mcp-cluster
  labels:
    {{- include "fleetops.chartLabels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "fleetops:fleetops-mcp-cluster"}
subjects:
  - {kind: ServiceAccount, name: fleetops-mcp, namespace: {{ .Release.Namespace }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fleetops-approvals-cluster
  labels:
    {{- include "fleetops.chartLabels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "fleetops:fleetops-approvals-cluster"}
subjects:
  - {kind: ServiceAccount, name: fleetops-approvals, namespace: {{ .Release.Namespace }}}
