# Fleet Ops Copilot chart values. With these defaults the rendered objects are
# the ones in config/ on main (CRDs, RBAC, admission policies, config/deploy);
# `make chart-parity` checks that.
#
# Install into namespace foc-system only: the admission policies and the
# envtest identities name ServiceAccounts in foc-system (docs/KNOWN-LIMITS.md,
# "ServiceAccount names"). Any other release namespace fails the render.

image:
  repository: fleet-ops-copilot
  tag: dev
  pullPolicy: IfNotPresent

# Swarmada namespaces the copilot works in. Each one gets the two namespaced
# RoleBindings (foc-mcp, foc-approvals). Every namespace the policy file lists
# must be here; the render fails otherwise. The first entry is foc-mcp's
# default namespace (-namespace).
swarmadaNamespaces:
  - warehouse-a

# Copilot policy file, mounted from ConfigMap fleetops-policy. Empty: the
# chart's files/default-policy.yaml, a copy of policies/default.yaml. Set to
# the full YAML text of a policy file to replace it (helm --set-file
# policy.content=<file>). Hard invariants are compiled into the binaries and
# cannot be enabled here (docs/DESIGN.md §3.2).
policy:
  content: ""

mcp:
  replicas: 1
  port: 8080
  resources: {}

approvals:
  replicas: 1
  probePort: 8081
  resources: {}

# foc-agent talks to the model, reaches foc-mcp over MCP and serves the web
# chat with the approval-requests panel (Service foc-agent, port below). Its
# ServiceAccount may only get and list ApprovalRequests. With llm.profile
# cloud it runs the claude backend and needs the Secret in
# llm.cloud.apiKeySecretRef; the pod does not start without it.
agent:
  serviceAccount:
    create: true
  # false renders no foc-agent Deployment or Service (the ServiceAccount and
  # its read-only RoleBindings stay).
  enabled: true
  replicas: 1
  port: 8090
  # Chat requests in flight per pod; more get HTTP 429.
  maxConcurrent: 4
  resources: {}

# OpenTelemetry traces from foc-agent and foc-mcp: one trace per operator
# request (model calls, tool calls, policy decisions). OTLP/gRPC collector as
# host:port (plaintext), http://host:port or https://host:port. Empty: off.
# Exporter headers, if the collector needs them, go in
# OTEL_EXPORTER_OTLP_HEADERS from a Secret; the chart does not template them.
tracing:
  otlpEndpoint: ""

# Model backend profile.
llm:
  # cloud | airgap. Only cloud is templated. airgap fails the render on
  # purpose: the air-gapped profile (llama-server, its storage and egress
  # policy) is installed beside the chart from config/airgap (make deploy-airgap).
  profile: cloud
  cloud:
    model: claude-sonnet-5-5
    # Reference to a Secret that already exists in foc-system. The chart never
    # creates, reads or templates the key itself. foc-agent receives it as the
    # ANTHROPIC_API_KEY environment variable (docs/DESIGN.md §3.8).
    apiKeySecretRef:
      name: fleet-ops-copilot-claude
      key: ANTHROPIC_API_KEY

# Audit files. emptyDir only, as in config/deploy: the files are lost when a
# pod is replaced (docs/KNOWN-LIMITS.md, "Audit storage").
audit:
  dir: /var/lib/fleetops/audit

# NetworkPolicy for the cloud profile (docs/DESIGN.md §3.7). Off by default:
# main has no NetworkPolicy, and none of these has been applied to a cluster
# yet. When enabled, apiServer.cidrs is required (NetworkPolicy cannot select
# the API server by label). Enforcement needs a CNI that implements
# NetworkPolicy.
networkPolicy:
  enabled: false
  apiServer:
    # API server endpoint and Service address, each as a /32, for example
    # from `kubectl get endpointslices -n default -l kubernetes.io/service-name=kubernetes`
    # and `kubectl get svc -n default kubernetes`.
    cidrs: []
    ports: [443, 6443]
  dns:
    namespace: kube-system
    podLabels:
      k8s-app: kube-dns
  # foc-agent egress to the Claude API. NetworkPolicy has no FQDN rules, so
  # this is a list of CIDRs (or an egress proxy's address). Empty: no rule.
  claudeApiEgress:
    cidrs: []
    ports: [443]
  # Additional peers allowed to reach foc-mcp's MCP port besides foc-agent,
  # as NetworkPolicy `from` entries.
  mcpExtraIngressFrom: []
  # Egress from foc-agent and foc-mcp to the OTLP collector, as NetworkPolicy
  # `to` entries. Empty: no rule (spans are dropped when tracing is on).
  otlpEgress:
    to: []
    ports: [4317]
