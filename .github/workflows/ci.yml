name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# Runner image: pinned to ubuntu-24.04, which ubuntu-latest resolved to on
# 2026-11-04, so the gate's environment changes only when this file does.
# Actions are on their current majors, all of which run on Node 24.
jobs:
  # Runs on every push: checks that need no Go toolchain.
  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: No local-only files are tracked
        run: |
          tracked="$(git ls-files -- local go.work go.work.sum)"
          if [ -n "$tracked" ]; then echo "tracked but must stay local: $tracked"; exit 1; fi
      - name: Every Go file carries the Apache-2.0 header
        run: |
          missing="$(git ls-files '*.go' | xargs grep -L 'Licensed under the Apache License, Version 2.0' || true)"
          if [ -n "$missing" ]; then echo "missing header: $missing"; exit 1; fi
      - name: Every commit after the repository's first is signed off (DCO)
        run: |
          root="$(git rev-list --max-parents=0 HEAD)"
          bad=""
          for c in $(git rev-list --no-merges HEAD --not $root); do
            git show -s --format=%B "$c" | grep -q '^Signed-off-by: ' || bad="$bad $c"
          done
          if [ -n "$bad" ]; then echo "commits without Signed-off-by:$bad"; exit 1; fi

  # Build, vet, lint, unit tests, envtest and fixture evals, against the
  # Swarmada v0.4 commit go.mod pins (docs/DESIGN.md D1, D2, D26). The fixture
  # evals are the regression gate: they fail when any run fails, when a
  # category passes fewer runs than evals/baseline.json, or when the scenario
  # or category counts differ from it (docs/DESIGN.md D58).
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Installs golangci-lint on PATH; `make ci` runs it (target lint).
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-only: true
      - name: Install setup-envtest (version pinned in the Makefile)
        run: make envtest-assets
      - name: make ci
        run: make ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fixture-eval-results
          path: evals/results/fixtures/
