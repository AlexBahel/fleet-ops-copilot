name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# Runner image: pinned to ubuntu-24.04, which ubuntu-latest resolved to on
# 2026-11-04, so the gate's environment changes only when this file does.
# Actions are on their current majors, all of which run on Node 24.
jobs:
  # Runs on every push: checks that need no Go toolchain.
  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: No local-only files are tracked
        run: |
          tracked="$(git ls-files -- local go.work go.work.sum)"
          if [ -n "$tracked" ]; then echo "tracked but must stay local: $tracked"; exit 1; fi
      - name: Every Go file carries the Apache-2.0 header
        run: |
          missing="$(git ls-files '*.go' | xargs grep -L 'Licensed under the Apache License, Version 2.0' || true)"
          if [ -n "$missing" ]; then echo "missing header: $missing"; exit 1; fi
      # ShellCheck 0.11.0, pinned in hack/shellcheck.sh (release archive
      # checked against its SHA-256), the same version `make ci` runs; the
      # runner image's own shellcheck is not used. .shellcheckrc makes
      # `# shellcheck source=` paths relative to each script.
      - name: Shell scripts pass shellcheck 0.11.0
        run: make shellcheck
      - name: Every commit after the repository's first is signed off (DCO)
        run: |
          root="$(git rev-list --max-parents=0 HEAD)"
          bad=""
          for c in $(git rev-list --no-merges HEAD --not $root); do
            git show -s --format=%B "$c" | grep -q '^Signed-off-by: ' || bad="$bad $c"
          done
          if [ -n "$bad" ]; then echo "commits without Signed-off-by:$bad"; exit 1; fi

  # Build, vet, lint, unit tests, envtest and fixture evals, against the
  # Swarmada v0.4 commit go.mod pins (docs/DESIGN.md D1, D2, D26). The fixture
  # evals are the regression gate: they fail when any run fails, when a
  # category passes fewer runs than evals/baseline.json, or when the scenario
  # or category counts differ from it (docs/DESIGN.md D58).
  go:
    runs-on: ubuntu-24.04
    steps:
      # Full history: the baseline step below reads evals/baseline.json at the
      # event's base commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Installs golangci-lint on PATH; `make ci` runs it (target lint).
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-only: true
      - name: Install setup-envtest (version pinned in the Makefile)
        run: make envtest-assets
      # A warning annotation (never a failure) for every category the change
      # lowers in evals/baseline.json. The gate itself compares a run with the
      # baseline in the same commit, so a commit that lowers both passes; this
      # puts the lowering on the run page (scripts/baseline-lowered, D58).
      - name: Warn when evals/baseline.json lowers a category
        run: go run ./scripts/baseline-lowered -base "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: make ci
        run: make ci
      # make ci writes only ignored files (its self-test to evals/results/tmp/selftest/).
      - name: make ci left the tracked files unchanged
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
      # D83: build the binaries under umask 077 and the image, and run each
      # binary in it as user 65532. The runner has Docker; the test fails
      # rather than skips when it cannot reach it.
      - name: Image binaries run as the non-root user
        run: make test-image
        env:
          FLEETOPS_IMAGE_TEST_REQUIRED: "1"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fixture-eval-results
          path: evals/results/tmp/selftest/
