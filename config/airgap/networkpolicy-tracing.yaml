#
# Air-gapped profile with the chart's optional trace backend
# (tracing.backend.enabled, D61): fleetops-mcp and fleetops-agent may also open
# connections to the OpenTelemetry Collector's OTLP/gRPC port in this
# namespace (D69). Nothing else is opened. Under networkpolicy.yaml both
# pods are already limited to DNS, the API server and their in-namespace
# peers, so this adds exactly that one destination.
#
# make deploy-airgap applies this file only when deploy/fleetops-otel-collector
# exists in fleetops-system. The Collector's own egress (Jaeger's OTLP port and
# DNS) comes from the chart (fleetops-otel-collector-egress-jaeger, D68).
#
# The chart does not render this rule without networkPolicy.enabled: an
# Egress policy selecting a pod denies that pod everything it does not list,
# so on a cluster without config/airgap it would cut fleetops-mcp and fleetops-agent off
# from the API server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fleetops-airgap-egress-otlp
  namespace: fleetops-system
  labels: {app.kubernetes.io/part-of: fleet-ops-copilot}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [fleetops-mcp, fleetops-agent]}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: fleetops-otel-collector}}
      ports:
        - {protocol: TCP, port: 4317}
