# foc-mcp (tool server), foc-approvals (approval controller and executor) and
# foc-agent (model loop and web UI) in namespace foc-system. Apply after
# config/crd, config/rbac and config/admission (make deploy-kind). The policy
# file comes from ConfigMap fleetops-policy (created by make deploy-kind from
# policies/default.yaml), foc-agent's site catalogue from ConfigMap
# fleetops-catalogue (from catalogue/warehouse-a.yaml). foc-agent does not start until Secret
# fleet-ops-copilot-claude (key ANTHROPIC_API_KEY) exists in foc-system.
# Audit files are on emptyDir volumes: they do not survive a pod restart
# (docs/KNOWN-LIMITS.md, "Audit storage").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foc-mcp
  namespace: foc-system
  labels: {app.kubernetes.io/name: foc-mcp, app.kubernetes.io/part-of: fleet-ops-copilot}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: foc-mcp}
  template:
    metadata:
      labels: {app.kubernetes.io/name: foc-mcp, app.kubernetes.io/part-of: fleet-ops-copilot}
    spec:
      serviceAccountName: foc-mcp
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: foc-mcp
          image: fleet-ops-copilot:dev
          imagePullPolicy: IfNotPresent
          command: [/usr/local/bin/foc-mcp]
          args: [-policy=/etc/fleetops/policy/default.yaml, -audit=/var/lib/fleetops/audit/foc-mcp.jsonl, -namespace=warehouse-a, -listen=:8080]
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: SERVICE_ACCOUNT
              valueFrom: {fieldRef: {fieldPath: spec.serviceAccountName}}
          ports: [{name: mcp, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: mcp}, periodSeconds: 5}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: policy, mountPath: /etc/fleetops/policy, readOnly: true}
            - {name: audit, mountPath: /var/lib/fleetops/audit}
      volumes:
        - name: policy
          configMap: {name: fleetops-policy}
        - name: audit
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: foc-mcp
  namespace: foc-system
  labels: {app.kubernetes.io/name: foc-mcp, app.kubernetes.io/part-of: fleet-ops-copilot}
spec:
  selector: {app.kubernetes.io/name: foc-mcp}
  ports: [{name: mcp, port: 8080, targetPort: mcp}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foc-approvals
  namespace: foc-system
  labels: {app.kubernetes.io/name: foc-approvals, app.kubernetes.io/part-of: fleet-ops-copilot}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: foc-approvals}
  template:
    metadata:
      labels: {app.kubernetes.io/name: foc-approvals, app.kubernetes.io/part-of: fleet-ops-copilot}
    spec:
      serviceAccountName: foc-approvals
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: foc-approvals
          image: fleet-ops-copilot:dev
          imagePullPolicy: IfNotPresent
          command: [/usr/local/bin/foc-approvals]
          args: [-policy=/etc/fleetops/policy/default.yaml, -audit=/var/lib/fleetops/audit/foc-approvals.jsonl, -health-probe-bind-address=:8081]
          ports: [{name: probes, containerPort: 8081}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: policy, mountPath: /etc/fleetops/policy, readOnly: true}
            - {name: audit, mountPath: /var/lib/fleetops/audit}
      volumes:
        - name: policy
          configMap: {name: fleetops-policy}
        - name: audit
          emptyDir: {}
---
# foc-agent: Claude backend, MCP client of foc-mcp, web UI on :8090. Its
# ServiceAccount may only get and list ApprovalRequests. No login: requests
# filed from the page record an unverified requester and cannot be approved
# (R38). ClusterIP only, no Ingress: kubectl port-forward svc/foc-agent 8090:8090.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foc-agent
  namespace: foc-system
  labels: {app.kubernetes.io/name: foc-agent, app.kubernetes.io/part-of: fleet-ops-copilot}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: foc-agent}
  template:
    metadata:
      labels: {app.kubernetes.io/name: foc-agent, app.kubernetes.io/part-of: fleet-ops-copilot}
    spec:
      serviceAccountName: foc-agent
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: foc-agent
          image: fleet-ops-copilot:dev
          imagePullPolicy: IfNotPresent
          command: [/usr/local/bin/foc-agent]
          args: [-backend=claude, -listen=:8090, -mcp-url=http://foc-mcp:8080/mcp, -namespaces=warehouse-a, -max-concurrent=4, -catalogue=/etc/fleetops/catalogue/site.yaml, -audit=/var/lib/fleetops/audit/foc-agent.jsonl]
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: {name: fleet-ops-copilot-claude, key: ANTHROPIC_API_KEY}
            - name: FOC_CLAUDE_MODEL
              value: claude-sonnet-5-5
          ports: [{name: http, containerPort: 8090}]
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 10, timeoutSeconds: 5}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: catalogue, mountPath: /etc/fleetops/catalogue, readOnly: true}
            - {name: audit, mountPath: /var/lib/fleetops/audit}
      volumes:
        - name: catalogue
          configMap: {name: fleetops-catalogue}
        - name: audit
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: foc-agent
  namespace: foc-system
  labels: {app.kubernetes.io/name: foc-agent, app.kubernetes.io/part-of: fleet-ops-copilot}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: foc-agent}
  ports: [{name: http, port: 8090, targetPort: http}]
