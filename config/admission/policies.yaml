# ValidatingAdmissionPolicies (Kubernetes >= 1.30). RBAC cannot restrict a
# create by field or a patch to one annotation; these policies do
# (docs/DESIGN.md §3.6). ServiceAccount names assume namespace foc-system.
---
# foc-approvals may only CREATE FleetTasks, and only as drafts labelled as its own.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: fleetops-foc-approvals-drafts-only
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["swarmada.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["fleettasks"]
  matchConditions:
    - name: is-foc-approvals
      expression: "request.userInfo.username == 'system:serviceaccount:foc-system:foc-approvals'"
  validations:
    - expression: "request.operation == 'CREATE'"
      message: "foc-approvals may only create FleetTasks; it never changes or deletes one"
    - expression: "request.operation != 'CREATE' || (has(object.spec.draft) && object.spec.draft == true)"
      message: "foc-approvals may only create a FleetTask with spec.draft: true"
    - expression: "request.operation != 'CREATE' || (has(object.metadata.labels) && 'fleetops.alexbahel.github.io/created-by' in object.metadata.labels && object.metadata.labels['fleetops.alexbahel.github.io/created-by'] == 'foc-approvals')"
      message: "a FleetTask created by foc-approvals must carry fleetops.alexbahel.github.io/created-by: foc-approvals"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: fleetops-foc-approvals-drafts-only
spec:
  policyName: fleetops-foc-approvals-drafts-only
  validationActions: ["Deny"]
---
# foc-approvals may only add swarmada.io/estop-triggered to a FleetZone that
# lacks it; nothing else on the object may change.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: fleetops-foc-approvals-zone-stop-only
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["swarmada.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["fleetzones"]
  matchConditions:
    - name: is-foc-approvals
      expression: "request.userInfo.username == 'system:serviceaccount:foc-system:foc-approvals'"
  validations:
    - expression: "request.operation == 'UPDATE'"
      message: "foc-approvals may only add the estop annotation to an existing FleetZone"
    - expression: "request.operation != 'UPDATE' || object.spec == oldObject.spec"
      message: "foc-approvals may not change FleetZone spec"
    - expression: >-
        request.operation != 'UPDATE' ||
        (has(object.metadata.annotations) && 'swarmada.io/estop-triggered' in object.metadata.annotations &&
         !(has(oldObject.metadata.annotations) && 'swarmada.io/estop-triggered' in oldObject.metadata.annotations))
      message: "foc-approvals may only add swarmada.io/estop-triggered where it is absent; it never changes or removes it"
    - expression: >-
        request.operation != 'UPDATE' ||
        (object.metadata.annotations.all(k, k == 'swarmada.io/estop-triggered' ||
           (has(oldObject.metadata.annotations) && k in oldObject.metadata.annotations && oldObject.metadata.annotations[k] == object.metadata.annotations[k])) &&
         (!has(oldObject.metadata.annotations) || oldObject.metadata.annotations.all(k, k in object.metadata.annotations)))
      message: "foc-approvals may not change any other annotation"
    - expression: >-
        request.operation != 'UPDATE' ||
        (has(oldObject.metadata.labels) ? (has(object.metadata.labels) && object.metadata.labels == oldObject.metadata.labels) : !has(object.metadata.labels))
      message: "foc-approvals may not change FleetZone labels"
    - expression: >-
        request.operation != 'UPDATE' ||
        (has(oldObject.metadata.finalizers) ? (has(object.metadata.finalizers) && object.metadata.finalizers == oldObject.metadata.finalizers) : !has(object.metadata.finalizers))
      message: "foc-approvals may not change FleetZone finalizers"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: fleetops-foc-approvals-zone-stop-only
spec:
  policyName: fleetops-foc-approvals-zone-stop-only
  validationActions: ["Deny"]
---
# A decision is made by a person, names that person, and is never changed.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: fleetops-decisions
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["fleetops.alexbahel.github.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["approvaldecisions"]
  validations:
    - expression: "request.operation == 'CREATE'"
      message: "an ApprovalDecision is immutable"
    - expression: "!request.userInfo.username.startsWith('system:serviceaccount:') && !(has(request.userInfo.groups) && 'system:serviceaccounts' in request.userInfo.groups)"
      message: "a ServiceAccount cannot decide an ApprovalRequest; only a person can"
    - expression: "object.spec.decidedBy == request.userInfo.username"
      message: "spec.decidedBy must be the authenticated user creating the decision"
    - expression: >-
        has(object.spec.decidedByGroups)
          ? (has(request.userInfo.groups) && object.spec.decidedByGroups == request.userInfo.groups)
          : (!has(request.userInfo.groups) || size(request.userInfo.groups) == 0)
      message: "spec.decidedByGroups must be the authenticated user's groups"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: fleetops-decisions
spec:
  policyName: fleetops-decisions
  validationActions: ["Deny"]
---
# A request names the identity that created it, so self-approval checks hold
# even for a request a person creates by hand.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: fleetops-requests
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["fleetops.alexbahel.github.io"]
        apiVersions: ["*"]
        operations: ["CREATE"]
        resources: ["approvalrequests"]
  validations:
    - expression: "object.spec.requestedBy == request.userInfo.username"
      message: "spec.requestedBy must be the authenticated identity creating the request"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: fleetops-requests
spec:
  policyName: fleetops-requests
  validationActions: ["Deny"]
