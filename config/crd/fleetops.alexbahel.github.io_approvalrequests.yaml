---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: approvalrequests.fleetops.alexbahel.github.io
spec:
  group: fleetops.alexbahel.github.io
  names:
    kind: ApprovalRequest
    listKind: ApprovalRequestList
    plural: approvalrequests
    shortNames:
    - areq
    singular: approvalrequest
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.requestedFor
      name: For
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .status.decidedBy
      name: DecidedBy
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ApprovalRequest is a proposed Swarmada write that a named person
          must approve.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ApprovalRequestSpec is written once by foc-mcp and never
              changed.
            properties:
              activateTask:
                description: ActivateTaskParams names the draft FleetTask to activate.
                properties:
                  taskName:
                    description: TaskName is the draft FleetTask in the request's
                      namespace.
                    minLength: 1
                    type: string
                required:
                - taskName
                type: object
              checks:
                description: Checks are the check_task results when the request was
                  filed (D77).
                properties:
                  checkedAt:
                    format: date-time
                    type: string
                  checks:
                    items:
                      description: CheckRecord is one check of check_task (DESIGN.md
                        §3.10.4).
                      properties:
                        code:
                          type: string
                        detail:
                          type: string
                        name:
                          type: string
                        outcome:
                          enum:
                          - Passed
                          - Warning
                          - Blocked
                          - NotChecked
                          type: string
                      required:
                      - name
                      - outcome
                      type: object
                    type: array
                  dryRuns:
                    items:
                      description: CheckRecord is one check of check_task (DESIGN.md
                        §3.10.4).
                      properties:
                        code:
                          type: string
                        detail:
                          type: string
                        name:
                          type: string
                        outcome:
                          enum:
                          - Passed
                          - Warning
                          - Blocked
                          - NotChecked
                          type: string
                      required:
                      - name
                      - outcome
                      type: object
                    type: array
                  verdict:
                    description: Verdict is "likely feasible" or "blocked".
                    type: string
                required:
                - checkedAt
                - verdict
                type: object
              draftTask:
                description: |-
                  DraftTaskParams is the FleetTask foc-approvals creates, held as a draft,
                  after a named person approves.
                properties:
                  actions:
                    items:
                      description: |-
                        DraftAction is one member of a drafted FleetTask, limited to the
                        FleetActionSpec fields the copilot may set.
                      properties:
                        bounds:
                          description: Bounds names the area of a Custom explore-floor
                            survey (payload bounds).
                          type: string
                        customType:
                          description: CustomType names the verb of a Custom action
                            (FleetAction spec.customType).
                          type: string
                        dependsOn:
                          items:
                            type: string
                          type: array
                        dock:
                          description: Dock names the charging dock or waypoint for
                            a Charge (payload dock).
                          type: string
                        instruction:
                          description: Instruction is the requester's own words, verbatim
                            (payload instruction).
                          maxLength: 2000
                          type: string
                        location:
                          description: |-
                            Location is where the action takes place; the executor writes it into
                            the payload in the site catalogue's convention (DESIGN.md D77).
                          properties:
                            waypoint:
                              type: string
                            x:
                              pattern: ^-?[0-9]+(\.[0-9]+)?$
                              type: string
                            "y":
                              pattern: ^-?[0-9]+(\.[0-9]+)?$
                              type: string
                            zone:
                              minLength: 1
                              type: string
                          required:
                          - zone
                          type: object
                        lookFor:
                          description: LookFor lists what an inspection is about (payload
                            lookFor).
                          items:
                            type: string
                          type: array
                        name:
                          minLength: 1
                          type: string
                        onFailure:
                          description: 'OnFailure is Swarmada''s onFailure: Requeue
                            (default, bounded retries) or Alert.'
                          enum:
                          - Requeue
                          - Alert
                          type: string
                        preferredRobot:
                          type: string
                        priority:
                          type: string
                        requiredCapabilities:
                          items:
                            type: string
                          type: array
                        robotSelector:
                          description: RobotSelector pins the action to one robot
                            (FleetAction spec.robotSelector).
                          type: string
                        route:
                          description: Route is an ordered list of locations (patrol).
                          items:
                            description: |-
                              Location is a place in a FleetZone: a waypoint resolved to its pose.
                              Coordinates are decimal strings in the zone's frame (metres at this site).
                            properties:
                              waypoint:
                                type: string
                              x:
                                pattern: ^-?[0-9]+(\.[0-9]+)?$
                                type: string
                              "y":
                                pattern: ^-?[0-9]+(\.[0-9]+)?$
                                type: string
                              zone:
                                minLength: 1
                                type: string
                            required:
                            - zone
                            type: object
                          type: array
                        type:
                          description: Type is a Swarmada FleetAction spec.type.
                          minLength: 1
                          type: string
                        zone:
                          type: string
                      required:
                      - name
                      - type
                      type: object
                    minItems: 1
                    type: array
                  purpose:
                    description: Purpose is shown to the person who reviews the draft.
                    type: string
                  repeat:
                    description: Repeat, when set, runs the actions in order Times
                      times (spec.flow).
                    properties:
                      times:
                        description: Times is the number of rounds.
                        format: int32
                        maximum: 100
                        minimum: 1
                        type: integer
                    required:
                    - times
                    type: object
                  taskName:
                    description: TaskName is the FleetTask name in the request's namespace.
                    minLength: 1
                    type: string
                required:
                - actions
                - taskName
                type: object
              expiresAt:
                description: ExpiresAt is when the request stops being approvable.
                format: date-time
                type: string
              policy:
                description: PolicyRecord is the policy engine's decision when the
                  request was created.
                properties:
                  code:
                    description: Code is a stable reason code.
                    type: string
                  effect:
                    description: Effect is RequireApproval for every stored request.
                    type: string
                  message:
                    type: string
                required:
                - code
                - effect
                type: object
              preview:
                description: Preview is the preview the requester confirmed (D74).
                properties:
                  catalogueSHA256:
                    type: string
                  catalogueVersion:
                    description: CatalogueVersion and CatalogueSHA256 identify the
                      site catalogue.
                    format: int32
                    type: integer
                  confirmedAt:
                    description: ConfirmedAt is when foc-mcp received the confirmation.
                    format: date-time
                    type: string
                  failureHandling:
                    description: FailureHandling is what the copilot does when the
                      task fails (D78).
                    enum:
                    - ReportOnly
                    - PrepareFollowUp
                    type: string
                  id:
                    description: |-
                      ID is the SHA-256 of the request parameters with this record (ID and
                      ConfirmedAt left empty).
                    minLength: 1
                    type: string
                  instruction:
                    description: Instruction is the requester's own words for a "something
                      else" request.
                    maxLength: 2000
                    type: string
                  interpretation:
                    description: Interpretation says how a request was understood
                      (DESIGN.md §3.10.3).
                    enum:
                    - Known
                    - Composed
                    type: string
                  kind:
                    description: Kind is the catalogue kind.
                    minLength: 1
                    type: string
                  resultReported:
                    description: |-
                      ResultReported is false when Swarmada records arrival and completion,
                      not what the robot found (class (b) kinds).
                    type: boolean
                required:
                - catalogueSHA256
                - catalogueVersion
                - failureHandling
                - id
                - interpretation
                - kind
                - resultReported
                type: object
              requestedBy:
                description: RequestedBy is the principal that created the object
                  (the copilot).
                minLength: 1
                type: string
              requestedFor:
                description: RequestedFor is the operator whose chat session produced
                  the request.
                minLength: 1
                type: string
              sessionID:
                description: SessionID links the request to the copilot session and
                  audit trail.
                type: string
              type:
                description: RequestType names the single Swarmada write an approved
                  request leads to.
                enum:
                - DraftTask
                - ActivateTask
                - ZoneMaintenance
                - ZoneStop
                type: string
              zoneMaintenance:
                description: |-
                  ZoneMaintenanceParams are the ZoneMaintenance fields the copilot may set.
                  autoResumeAfterMinutes is not a parameter: the copilot always writes 0.
                properties:
                  mode:
                    description: Mode is Graceful or Immediate (Swarmada ZoneMaintenance
                      spec.mode).
                    enum:
                    - Graceful
                    - Immediate
                    type: string
                  reason:
                    description: Reason is copied to the ZoneMaintenance spec.reason.
                    minLength: 1
                    type: string
                  scheduledStart:
                    description: ScheduledStart is copied to spec.scheduledStart;
                      empty means on creation.
                    format: date-time
                    type: string
                  scopeType:
                    description: ScopeType is Zone or Namespace (Swarmada ZoneMaintenance
                      spec.scope.type).
                    enum:
                    - Zone
                    - Namespace
                    type: string
                  zoneName:
                    description: ZoneName is required when ScopeType is Zone.
                    type: string
                required:
                - mode
                - reason
                - scopeType
                type: object
              zoneStop:
                description: ZoneStopParams names the FleetZone to stop.
                properties:
                  reason:
                    description: Reason becomes the swarmada.io/estop-triggered annotation
                      value.
                    minLength: 1
                    type: string
                  zoneName:
                    minLength: 1
                    type: string
                required:
                - reason
                - zoneName
                type: object
            required:
            - expiresAt
            - policy
            - requestedBy
            - requestedFor
            - type
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
            - message: draftTask is set exactly when type is DraftTask
              rule: (self.type == 'DraftTask') == has(self.draftTask)
            - message: activateTask is set exactly when type is ActivateTask
              rule: (self.type == 'ActivateTask') == has(self.activateTask)
            - message: zoneMaintenance is set exactly when type is ZoneMaintenance
              rule: (self.type == 'ZoneMaintenance') == has(self.zoneMaintenance)
            - message: zoneStop is set exactly when type is ZoneStop
              rule: (self.type == 'ZoneStop') == has(self.zoneStop)
          status:
            description: ApprovalRequestStatus is written only by foc-approvals.
            properties:
              activatedBy:
                description: |-
                  ActivatedBy is the person who activated the draft: spec.decidedBy of
                  the Activation ApprovalDecision foc activate created (ActivationRef);
                  "unknown" when the draft left Draft with no such record (D79).
                type: string
              activationRef:
                description: |-
                  ActivationRef is the Activation ApprovalDecision linked when the
                  draft left Draft; the most recent one when there are several.
                type: string
              decidedAt:
                format: date-time
                type: string
              decidedBy:
                type: string
              decisionRef:
                type: string
              executedAt:
                format: date-time
                type: string
              executionChecks:
                description: |-
                  ExecutionChecks are the checks and dry runs re-run immediately before
                  the write (D76).
                properties:
                  checkedAt:
                    format: date-time
                    type: string
                  checks:
                    items:
                      description: CheckRecord is one check of check_task (DESIGN.md
                        §3.10.4).
                      properties:
                        code:
                          type: string
                        detail:
                          type: string
                        name:
                          type: string
                        outcome:
                          enum:
                          - Passed
                          - Warning
                          - Blocked
                          - NotChecked
                          type: string
                      required:
                      - name
                      - outcome
                      type: object
                    type: array
                  dryRuns:
                    items:
                      description: CheckRecord is one check of check_task (DESIGN.md
                        §3.10.4).
                      properties:
                        code:
                          type: string
                        detail:
                          type: string
                        name:
                          type: string
                        outcome:
                          enum:
                          - Passed
                          - Warning
                          - Blocked
                          - NotChecked
                          type: string
                      required:
                      - name
                      - outcome
                      type: object
                    type: array
                  verdict:
                    description: Verdict is "likely feasible" or "blocked".
                    type: string
                required:
                - checkedAt
                - verdict
                type: object
              followUp:
                description: |-
                  FollowUp is a proposal, never filed without a new preview and
                  confirmation (D78).
                properties:
                  draftTask:
                    description: DraftTask carries the original parameters for the
                      new preview.
                    properties:
                      actions:
                        items:
                          description: |-
                            DraftAction is one member of a drafted FleetTask, limited to the
                            FleetActionSpec fields the copilot may set.
                          properties:
                            bounds:
                              description: Bounds names the area of a Custom explore-floor
                                survey (payload bounds).
                              type: string
                            customType:
                              description: CustomType names the verb of a Custom action
                                (FleetAction spec.customType).
                              type: string
                            dependsOn:
                              items:
                                type: string
                              type: array
                            dock:
                              description: Dock names the charging dock or waypoint
                                for a Charge (payload dock).
                              type: string
                            instruction:
                              description: Instruction is the requester's own words,
                                verbatim (payload instruction).
                              maxLength: 2000
                              type: string
                            location:
                              description: |-
                                Location is where the action takes place; the executor writes it into
                                the payload in the site catalogue's convention (DESIGN.md D77).
                              properties:
                                waypoint:
                                  type: string
                                x:
                                  pattern: ^-?[0-9]+(\.[0-9]+)?$
                                  type: string
                                "y":
                                  pattern: ^-?[0-9]+(\.[0-9]+)?$
                                  type: string
                                zone:
                                  minLength: 1
                                  type: string
                              required:
                              - zone
                              type: object
                            lookFor:
                              description: LookFor lists what an inspection is about
                                (payload lookFor).
                              items:
                                type: string
                              type: array
                            name:
                              minLength: 1
                              type: string
                            onFailure:
                              description: 'OnFailure is Swarmada''s onFailure: Requeue
                                (default, bounded retries) or Alert.'
                              enum:
                              - Requeue
                              - Alert
                              type: string
                            preferredRobot:
                              type: string
                            priority:
                              type: string
                            requiredCapabilities:
                              items:
                                type: string
                              type: array
                            robotSelector:
                              description: RobotSelector pins the action to one robot
                                (FleetAction spec.robotSelector).
                              type: string
                            route:
                              description: Route is an ordered list of locations (patrol).
                              items:
                                description: |-
                                  Location is a place in a FleetZone: a waypoint resolved to its pose.
                                  Coordinates are decimal strings in the zone's frame (metres at this site).
                                properties:
                                  waypoint:
                                    type: string
                                  x:
                                    pattern: ^-?[0-9]+(\.[0-9]+)?$
                                    type: string
                                  "y":
                                    pattern: ^-?[0-9]+(\.[0-9]+)?$
                                    type: string
                                  zone:
                                    minLength: 1
                                    type: string
                                required:
                                - zone
                                type: object
                              type: array
                            type:
                              description: Type is a Swarmada FleetAction spec.type.
                              minLength: 1
                              type: string
                            zone:
                              type: string
                          required:
                          - name
                          - type
                          type: object
                        minItems: 1
                        type: array
                      purpose:
                        description: Purpose is shown to the person who reviews the
                          draft.
                        type: string
                      repeat:
                        description: Repeat, when set, runs the actions in order Times
                          times (spec.flow).
                        properties:
                          times:
                            description: Times is the number of rounds.
                            format: int32
                            maximum: 100
                            minimum: 1
                            type: integer
                        required:
                        - times
                        type: object
                      taskName:
                        description: TaskName is the FleetTask name in the request's
                          namespace.
                        minLength: 1
                        type: string
                    required:
                    - actions
                    - taskName
                    type: object
                  kind:
                    description: Kind is the catalogue kind of the original request.
                    type: string
                  summary:
                    description: Summary says what the follow-up would do.
                    type: string
                required:
                - draftTask
                - kind
                - summary
                type: object
              instruction:
                description: |-
                  Instruction is the exact command the approver runs with their own
                  credentials, for a write Swarmada refuses to every ServiceAccount
                  (activation). The copilot then observes the result.
                type: string
              message:
                type: string
              outcome:
                description: Outcome is the task's terminal result, recorded after
                  activation (D78).
                properties:
                  failedMember:
                    type: string
                  failureReason:
                    type: string
                  observedAt:
                    format: date-time
                    type: string
                  phase:
                    description: Phase is the FleetTask's terminal status.phase.
                    type: string
                required:
                - observedAt
                - phase
                type: object
              refusedDecisions:
                description: RefusedDecisions lists ApprovalDecisions that were not
                  accepted.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              state:
                description: RequestState is the lifecycle state of an ApprovalRequest.
                enum:
                - Pending
                - Approved
                - Rejected
                - Expired
                - Executed
                - Failed
                type: string
              target:
                description: TargetRef identifies the Swarmada object an executed
                  request wrote.
                properties:
                  apiVersion:
                    type: string
                  kind:
                    type: string
                  name:
                    type: string
                required:
                - apiVersion
                - kind
                - name
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
