# ClusterRoles are templates; namespaced rules are granted per Swarmada
# namespace with a RoleBinding (bindings.yaml), as Swarmada's own roles are.
#
# No rule below grants delete, update on a Swarmada kind, or the custom verbs
# activate, cancel, append, estop-clear, admit, reject, rollout-resume,
# policy-reset or trigger-response-*.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fleetops:fleetops-mcp
rules:
  - apiGroups: ["swarmada.io"]
    resources: [robots, fleettasks, fleetactions, fleetzones, zonemaintenances, discoveredrobots, fleetadapters, robotclasses, tasktriggers]
    verbs: [get, list, watch]
  # check_task reads the namespace stop markers and maxPendingActionsPerZone
  # in code and drops the rest of the object (R66, R69); never through a
  # model-facing tool.
  - apiGroups: ["swarmada.io"]
    resources: [swarmadaconfigs]
    verbs: [get, list]
  # No Swarmada write of any kind: every change is an ApprovalRequest.
  - apiGroups: ["fleetops.alexbahel.github.io"]
    resources: [approvalrequests]
    verbs: [create, get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, create]
---
# fleetops-agent reads ApprovalRequests for the web UI's requests panel. Nothing
# else: no Swarmada access, no write of any kind, no decisions.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fleetops:fleetops-agent
rules:
  - apiGroups: ["fleetops.alexbahel.github.io"]
    resources: [approvalrequests]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fleetops:fleetops-mcp-cluster
rules:
  # Draft-gate check before a DraftTask or ActivateTask request (docs/DESIGN.md §3.2).
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: [validatingwebhookconfigurations]
    verbs: [get, list]
  # Authenticate the caller of each tool call: the person's bearer token is
  # verified with a TokenReview and its username becomes the requester (R39).
  - apiGroups: ["authentication.k8s.io"]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fleetops:fleetops-approvals
rules:
  - apiGroups: ["swarmada.io"]
    resources: [robots, fleettasks, fleetactions, fleetzones, zonemaintenances, fleetadapters]
    verbs: [get, list, watch]
  # The execution re-check reads the namespace stop markers and the Pending
  # cap (R66), as check_task does.
  - apiGroups: ["swarmada.io"]
    resources: [swarmadaconfigs]
    verbs: [get, list]
  - apiGroups: ["swarmada.io"]
    resources: [zonemaintenances]
    verbs: [create]
  # Dry runs only: before an approved draft is created, each member is
  # dry-run as a FleetAction so Swarmada's catalog check and Pending cap
  # answer (R65, D76). The fleetops-approvals-dry-run-only admission
  # policy refuses any FleetAction create that is not a dry run.
  - apiGroups: ["swarmada.io"]
    resources: [fleetactions]
    verbs: [create]
  # Approved drafts only; the fleetops-approvals-drafts-only admission
  # policy refuses any FleetTask create without spec.draft: true.
  - apiGroups: ["swarmada.io"]
    resources: [fleettasks]
    verbs: [create]
  # Zone stop: patch delivers the swarmada.io/estop-triggered annotation and
  # estop-trigger authorizes it at Swarmada admission. The
  # fleetops-approvals-zone-stop-only admission policy narrows patch to
  # adding that one annotation.
  - apiGroups: ["swarmada.io"]
    resources: [fleetzones]
    verbs: [patch, estop-trigger]
  - apiGroups: ["fleetops.alexbahel.github.io"]
    resources: [approvalrequests, approvaldecisions]
    verbs: [get, list, watch]
  - apiGroups: ["fleetops.alexbahel.github.io"]
    resources: [approvalrequests/status]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fleetops:fleetops-approvals-cluster
rules:
  - apiGroups: ["authorization.k8s.io"]
    resources: [subjectaccessreviews]
    verbs: [create]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: [validatingwebhookconfigurations]
    verbs: [get, list]
---
# Bound to people who may decide requests. Deciding also requires the
# Swarmada permission for the underlying write (checked by fleetops-approvals).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fleetops:approver
rules:
  - apiGroups: ["fleetops.alexbahel.github.io"]
    resources: [approvalrequests]
    verbs: [get, list, watch]
  - apiGroups: ["fleetops.alexbahel.github.io"]
    resources: [approvaldecisions]
    verbs: [create, get, list, watch]
