# Bindings for one Swarmada namespace (warehouse-a, the quickstart namespace).
# Repeat the three RoleBindings for every namespace the policy file lists.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleetops-mcp
  namespace: warehouse-a
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "fleetops:fleetops-mcp"}
subjects:
  - {kind: ServiceAccount, name: fleetops-mcp, namespace: fleetops-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleetops-approvals
  namespace: warehouse-a
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "fleetops:fleetops-approvals"}
subjects:
  - {kind: ServiceAccount, name: fleetops-approvals, namespace: fleetops-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleetops-agent
  namespace: warehouse-a
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "fleetops:fleetops-agent"}
subjects:
  - {kind: ServiceAccount, name: fleetops-agent, namespace: fleetops-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fleetops-mcp-cluster
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "fleetops:fleetops-mcp-cluster"}
subjects:
  - {kind: ServiceAccount, name: fleetops-mcp, namespace: fleetops-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fleetops-approvals-cluster
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "fleetops:fleetops-approvals-cluster"}
subjects:
  - {kind: ServiceAccount, name: fleetops-approvals, namespace: fleetops-system}
