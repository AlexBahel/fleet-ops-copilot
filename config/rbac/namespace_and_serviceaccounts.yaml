# Copilot namespace and its three ServiceAccounts (docs/DESIGN.md §3, §3.6).
apiVersion: v1
kind: Namespace
metadata:
  name: fleetops-system
---
# Talks to the model and serves the web UI. May only get and list
# ApprovalRequests; no Swarmada access and no write.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleetops-agent
  namespace: fleetops-system
---
# MCP server: reads Swarmada and creates ApprovalRequests. No Swarmada write.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleetops-mcp
  namespace: fleetops-system
---
# Approval controller: executes approved drafts, zone maintenance and zone stops.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleetops-approvals
  namespace: fleetops-system
