# Copilot namespace and its three ServiceAccounts (docs/DESIGN.md §3, §3.6).
apiVersion: v1
kind: Namespace
metadata:
  name: foc-system
---
# Talks to the model. Holds no Kubernetes permission.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: foc-agent
  namespace: foc-system
---
# MCP server: reads Swarmada and creates ApprovalRequests. No Swarmada write.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: foc-mcp
  namespace: foc-system
---
# Approval controller: executes approved drafts, zone maintenance and zone stops.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: foc-approvals
  namespace: foc-system
