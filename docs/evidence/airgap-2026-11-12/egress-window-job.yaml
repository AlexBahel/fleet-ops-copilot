#
# Measurement only (this directory's README.md): tries https://1.1.1.1
# every ~0.5 s from container start, with the egress probe's label, so the
# probe's policies apply. Not part of the profile.
apiVersion: batch/v1
kind: Job
metadata:
  name: fleetops-egress-window
  namespace: fleetops-system
  labels: {app.kubernetes.io/name: fleetops-egress-probe}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels: {app.kubernetes.io/name: fleetops-egress-probe}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: probe
          image: ghcr.io/ggml-org/llama.cpp:server-b12004
          imagePullPolicy: IfNotPresent
          command: [sh, -c]
          args:
            - |
              t0=$(date +%s%N)
              i=0
              while [ $i -lt 40 ]; do
                s=$(date +%s%N)
                curl -s --connect-timeout 1 --max-time 2 -o /dev/null https://1.1.1.1; rc=$?
                echo "t=$(( (s - t0) / 1000000 ))ms since container start: curl exit $rc"
                i=$((i+1)); sleep 0.5
              done
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
